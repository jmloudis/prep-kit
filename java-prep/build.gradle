plugins {
    id 'java'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.northstarcomm'
version = '0.0.1-SNAPSHOT'
description = 'java-prep'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

repositories {
    mavenCentral()
}

dependencies {

}

tasks.named('test') {
    useJUnitPlatform()
}

wrapper {
    gradleVersion = '6.8.1'
    distributionUrl = distributionUrl.replace("bin", "all")
}
